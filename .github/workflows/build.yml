# Сборка «Open Skies» (pack/, packwiz): индекс свежий, файлы для лаунчера собираются — .mrpack и экземпляр Prism,
# который ставит сборку с main сам при каждом запуске (tools/prism_instance.py); оба — в артефактах запуска.
# Новая version в pack.toml на main выходит сама: релиз v<version> с этими файлами под постоянными именами, их
# последняя версия скачивается без входа по releases/latest/download/<имя>.
name: build

# Каждый коммит проверяется один раз: ветки — запуском pull_request (он и решает слияние), main — push.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# новый пуш в ветку PR отменяет прежнюю проверку; запуск на main не отменяется — в нём может идти релиз
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pack:
    name: Сборка модов
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        working-directory: pack
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          cache: false

      - name: packwiz
        run: go install github.com/packwiz/packwiz@v0.0.0-20260906154125-ef87d964f8cb

      # .pw.toml правят руками или packwiz; индекс с их хешами должен быть пересчитан тем же коммитом
      - name: Индекс свежий
        run: |
          packwiz refresh
          git diff --exit-code -- .

      # мод, которому мало NeoForge сборки, роняет запуск игры («Error loading mods»), а индекс этого не видит
      - name: Моды принимают NeoForge сборки
        run: python3 ../tools/check_loader.py .

      - name: Версия сборки
        id: version
        run: |
          v=$(sed -n 's/^version = "\(.*\)"$/\1/p' pack.toml)
          [ -n "$v" ] || { echo "pack.toml: нет version"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # имена без версии: у релиза releases/latest/download/<имя> всегда ведёт к последней сборке; Prism называет
      # экземпляр по имени файла (пробел в имени файла выпуска GitHub заменил бы точкой)
      - name: Файл для лаунчера
        run: packwiz mr export -o Open-Skies.mrpack

      - name: Экземпляр Prism с автообновлением
        run: python3 ../tools/prism_instance.py Open-Skies.zip

      # заметки релиза — и на PR: новая версия без строки в «Версиях» README.md не дойдёт до main
      - name: Заметки релиза
        env:
          V: ${{ steps.version.outputs.version }}
        run: |
          # строка версии из таблицы «Версии» README.md: | версия | мод | что изменилось |
          row=$(awk -F ' [|] ' -v v="$V" '$1 == "| " v { print $2 "\t" substr($3, 1, length($3) - 2) }' ../README.md)
          [ -n "$row" ] || { echo "README.md: нет строки версии $V в «Версиях»"; exit 1; }
          mod=${row%%$'\t'*}
          changes=${row#*$'\t'}
          changes=${changes//](#/](https://github.com/zentixua/open-skies#}  # якоря README — в заметках полной ссылкой
          mc=$(sed -n 's/^minecraft = "\(.*\)"$/\1/p' pack.toml)
          neoforge=$(sed -n 's/^neoforge = "\(.*\)"$/\1/p' pack.toml)
          cat > release-notes.md <<EOF
          Minecraft $mc, NeoForge $neoforge, Incoming $mod. $changes

          ## Установка
          - \`Open-Skies.zip\` — экземпляр [Prism Launcher](https://prismlauncher.org/download/), который сам обновляет сборку перед каждым запуском игры: «Добавить экземпляр…» → «Импорт» → этот файл.
          - \`Open-Skies.mrpack\` — разовая установка этой версии без автообновления: импорт в Prism Launcher или Modrinth App.

          Подробно — [README](https://github.com/zentixua/open-skies#установка).
          EOF

      - uses: actions/upload-artifact@v6
        with:
          name: open-skies
          path: |
            pack/Open-Skies.mrpack
            pack/Open-Skies.zip
            pack/release-notes.md
          if-no-files-found: error

  # индекс и check_loader.py не видят падения при самой загрузке (ошибка в RegisterEvent, мод не принял другой мод):
  # сборка ставится с нуля, как у игрока и на сервере, и запускается — сервер до «Done», клиент до входа в мир
  boot:
    name: Запуск с нуля
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # клиенту — экран без монитора (Xvfb) и OpenGL на процессоре (Mesa llvmpipe); portablemc ставит Minecraft
      # и NeoForge клиента так же, как лаунчер
      - name: Xvfb, Mesa и portablemc
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq xvfb libgl1-mesa-dri libglx-mesa0 mesa-utils
          pipx install portablemc==5.0.6
          xvfb-run -a glxinfo -B | grep -E 'OpenGL (renderer|core profile version)'

      # Minecraft клиента (ассеты ~1 ГБ) и установщики — между запусками; ключ — версия NeoForge сборки
      - name: Кэш скачанного
        id: neoforge
        run: echo "version=$(sed -n 's/^neoforge = "\(.*\)"$/\1/p' pack/pack.toml)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: run/boot-cache
          key: boot-${{ steps.neoforge.outputs.version }}-pmc5.0.6

      - name: Сервер до «Done»
        run: python3 tools/boot_check.py server run/boot/server

      # мир — тот, что сервер только что создал: клиент открывает его Quick Play, как одиночную игру
      - name: Клиент до входа в мир
        run: |
          python3 tools/boot_check.py client run/boot/client --world run/boot/server/world \
            --wrap 'xvfb-run -a -s "-screen 0 1280x720x24" {cmd}'

      # тот же сервер снова, клиент входит на него по сети и пишет повтор Flashback у спящего жителя: реестры от
      # сервера и звуки, которые клиент играет сам (0.1.44 — запись падала на храпе Subtle Effects)
      - name: Запись Flashback на сервере
        run: |
          python3 tools/boot_check.py client run/boot/record --server run/boot/server --stay 90 \
            --wrap 'xvfb-run -a -s "-screen 0 1280x720x24" {cmd}'

      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: boot-logs
          path: |
            run/boot/*/logs/
            run/boot/*/crash-reports/
            run/boot/*/console.log
          if-no-files-found: ignore

  release:
    name: Релиз
    # релиз — только сборки, которая запускается с нуля
    needs: [pack, boot]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      V: ${{ needs.pack.outputs.version }}
    steps:
      - name: Есть ли уже
        id: exists
        run: |
          case $(gh release view "v$V" --json isDraft -q .isDraft 2>/dev/null) in
            false)
              echo "Релиз v$V уже есть — сборка этой версии вышла раньше" >> "$GITHUB_STEP_SUMMARY"
              echo "yes=true" >> "$GITHUB_OUTPUT" ;;
            # черновик остаётся от запуска, прерванного на загрузке файлов (gh выпускает через черновик): заново
            true) gh release delete "v$V" --yes ;;
          esac

      - uses: actions/download-artifact@v7
        if: steps.exists.outputs.yes != 'true'
        with:
          name: open-skies
          path: dist

      - name: Релиз
        if: steps.exists.outputs.yes != 'true'
        run: |
          gh release create "v$V" dist/Open-Skies.zip dist/Open-Skies.mrpack --target "$GITHUB_SHA" \
            --title "Open Skies $V" --notes-file dist/release-notes.md --latest
