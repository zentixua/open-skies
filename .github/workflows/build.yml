# Build Open Skies (pack/, packwiz): check that the index is fresh and build launcher files — .mrpack and a Prism
# instance that installs the pack from main before every launch (tools/prism_instance.py); both are run artifacts.
# A new version in pack.toml on main is released automatically: release v<version> with these files under fixed
# names. Their latest versions can be downloaded without signing in at releases/latest/download/<name>.
name: build

# Check each commit once: branches through pull_request (which determines merge readiness), main through push.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the PR branch cancels the previous check; a main run is not cancelled, as it may be releasing.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pack:
    name: Сборка модов
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        working-directory: pack
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          cache: false

      - name: packwiz
        run: go install github.com/packwiz/packwiz@v0.0.0-20260906154125-ef87d964f8cb

      # .pw.toml files are edited manually or by packwiz; recalculate their hashes in the index in the same commit.
      - name: Fresh index
        run: |
          packwiz refresh
          git diff --exit-code -- .

      # A mod requiring a newer NeoForge stops startup ("Error loading mods"); the index does not catch this.
      - name: Mods accept the pack's NeoForge
        run: python3 ../tools/check_loader.py .

      - name: Pack version
        id: version
        run: |
          v=$(sed -n 's/^version = "\(.*\)"$/\1/p' pack.toml)
          [ -n "$v" ] || { echo "pack.toml: missing version"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # Unversioned names: releases/latest/download/<name> always points to the latest pack; Prism names the
      # instance after the file (GitHub would replace a space in a release filename with a dot).
      - name: Launcher file
        run: packwiz mr export -o Open-Skies.mrpack

      - name: Prism instance with automatic updates
        run: python3 ../tools/prism_instance.py Open-Skies.zip

      # Generate release notes on PRs too: a new version without a row in README.md's version table cannot reach main.
      - name: Release notes
        env:
          V: ${{ steps.version.outputs.version }}
        run: |
          # Version row from README.md's version table: | version | mod | changes |
          row=$(awk -F ' [|] ' -v v="$V" '$1 == "| " v { print $2 "\t" substr($3, 1, length($3) - 2) }' ../README.md)
          [ -n "$row" ] || { echo "README.md: no row for version $V in the version table"; exit 1; }
          mod=${row%%$'\t'*}
          changes=${row#*$'\t'}
          changes=${changes//](#/](https://github.com/zentixua/open-skies#}  # Use full URLs for README anchors in the notes.
          mc=$(sed -n 's/^minecraft = "\(.*\)"$/\1/p' pack.toml)
          neoforge=$(sed -n 's/^neoforge = "\(.*\)"$/\1/p' pack.toml)
          cat > release-notes.md <<EOF
          Minecraft $mc, NeoForge $neoforge, Incoming $mod. $changes

          ## Установка
          - \`Open-Skies.zip\` — экземпляр [Prism Launcher](https://prismlauncher.org/download/), который сам обновляет сборку перед каждым запуском игры: «Добавить экземпляр…» → «Импорт» → этот файл.
          - \`Open-Skies.mrpack\` — разовая установка этой версии без автообновления: импорт в Prism Launcher или Modrinth App.

          Подробно — [README](https://github.com/zentixua/open-skies#установка).
          EOF

      - uses: actions/upload-artifact@v6
        with:
          name: open-skies
          path: |
            pack/Open-Skies.mrpack
            pack/Open-Skies.zip
            pack/release-notes.md
          if-no-files-found: error

  # The index and check_loader.py miss crashes during loading (RegisterEvent errors, a mod rejecting another mod):
  # install the pack from scratch, as for a player and on the server, then boot the server to "Done" and client to world entry.
  boot:
    name: Запуск с нуля
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Give the client a display without a monitor (Xvfb) and CPU OpenGL (Mesa llvmpipe); portablemc installs
      # client Minecraft and NeoForge just as a launcher does.
      - name: Xvfb, Mesa and portablemc
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq xvfb libgl1-mesa-dri libglx-mesa0 mesa-utils
          pipx install portablemc==5.0.6
          xvfb-run -a glxinfo -B | grep -E 'OpenGL (renderer|core profile version)'

      # Cache client Minecraft (~1 GB of assets) and installers between runs; key by the pack's NeoForge version.
      - name: Download cache
        id: neoforge
        run: echo "version=$(sed -n 's/^neoforge = "\(.*\)"$/\1/p' pack/pack.toml)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: run/boot-cache
          key: boot-${{ steps.neoforge.outputs.version }}-pmc5.0.6

      - name: Server reaches Done
        run: python3 tools/boot_check.py server run/boot/server

      # Use the world the server just created: the client opens it through Quick Play as singleplayer.
      - name: Client enters the world
        run: |
          python3 tools/boot_check.py client run/boot/client --world run/boot/server/world \
            --wrap 'xvfb-run -a -s "-screen 0 1280x720x24" {cmd}'

      # Restart the same server; the client joins over the network and records Flashback next to a sleeping
      # villager: server registries and sounds played by the client itself (0.1.44: recording crashed on Subtle Effects snoring).
      - name: Flashback recording on the server
        run: |
          python3 tools/boot_check.py client run/boot/record --server run/boot/server --stay 90 \
            --wrap 'xvfb-run -a -s "-screen 0 1280x720x24" {cmd}'

      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: boot-logs
          path: |
            run/boot/*/logs/
            run/boot/*/crash-reports/
            run/boot/*/console.log
          if-no-files-found: ignore

  release:
    name: Release
    # Release only a pack that boots from scratch.
    needs: [pack, boot]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      V: ${{ needs.pack.outputs.version }}
    steps:
      - name: Already released
        id: exists
        run: |
          case $(gh release view "v$V" --json isDraft -q .isDraft 2>/dev/null) in
            false)
              echo "Release v$V already exists — this pack version was released earlier" >> "$GITHUB_STEP_SUMMARY"
              echo "yes=true" >> "$GITHUB_OUTPUT" ;;
            # A run interrupted during upload leaves a draft (gh publishes through a draft): start again.
            true) gh release delete "v$V" --yes ;;
          esac

      - uses: actions/download-artifact@v7
        if: steps.exists.outputs.yes != 'true'
        with:
          name: open-skies
          path: dist

      - name: Release
        if: steps.exists.outputs.yes != 'true'
        run: |
          gh release create "v$V" dist/Open-Skies.zip dist/Open-Skies.mrpack --target "$GITHUB_SHA" \
            --title "Open Skies $V" --notes-file dist/release-notes.md --latest
